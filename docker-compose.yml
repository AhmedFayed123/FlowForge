version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: flowforge-db
    environment:
      POSTGRES_USER: flowforge
      POSTGRES_PASSWORD: flowforge_dev_pass
      POSTGRES_DB: flowforge_db
    ports:
      - "5432:5432"
    volumes:
      - flowforge_data:/var/lib/postgresql/data

volumes:
  flowforge_data: